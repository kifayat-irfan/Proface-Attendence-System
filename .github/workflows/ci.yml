name: CI

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install light deps (tests don't need dlib/OpenCV)
        run: pip install werkzeug pytest sqlalchemy
      - name: Run unit tests
        run: python -m pytest tests/ -v
